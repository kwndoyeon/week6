<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>LaYer Stamp</title>
	<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: white;
  }

  #picture {
    position: absolute;
    width: 250px;
    height: auto;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  input[type="color"] {
  width: 52px;
  height: 52px;
  padding: 5px;
  border: 1px solid #aaa;
  border-radius: 0;
  background: #fff;
  cursor: pointer;
}

input[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

input[type="color"]::-webkit-color-swatch,
input[type="color"]::-moz-color-swatch {
  border: 0;
  border-radius: 0;
}
button {
  border-radius: 0 !important;
}

</style>
</head>
<body>
<div id="stage">
  <img id="picture" src="1.jpg" alt="">
</div>

<script>
(() => {
  function init() {
    const picture =
      document.querySelector("#picture") ||
      document.querySelector('img[src*="1.jpg"]');

    const stage =
      document.querySelector("#stage") ||
      (picture && picture.parentElement);

    if (!picture || !stage) {
      console.error('#stage 영역과 src="1.jpg" 이미지가 필요해요.');
      return;
    }

    function start() {
      if (picture.dataset.stretchArtworkReady === "true") return;
      picture.dataset.stretchArtworkReady = "true";

      if (stage === document.body) {
        document.body.style.margin = "0";
      }

      if (getComputedStyle(stage).position === "static") {
        stage.style.position = "relative";
      }

      if (stage.clientWidth === 0) stage.style.width = "100vw";
      if (stage.clientHeight === 0) stage.style.height = "100vh";

      stage.style.overflow = "hidden";
      stage.style.touchAction = "none";

      picture.style.position = "absolute";
      picture.style.left = "0";
      picture.style.right = "auto";
      picture.style.top = "50%";
      picture.style.bottom = "auto";
      picture.style.transform = "translateY(-50%)";
      picture.style.zIndex = "1";
      picture.style.pointerEvents = "none";
      picture.draggable = false;

      picture.addEventListener("dragstart", (event) => {
        event.preventDefault();
      });

      let colorInput =
        document.querySelector("#bgColor") ||
        document.querySelector('input[type="color"]');

      if (!colorInput) {
        colorInput = document.createElement("input");
        colorInput.type = "color";
        colorInput.id = "bgColor";
        colorInput.value = "#ffffff";
      }

      const controls = document.createElement("div");

      Object.assign(controls.style, {
  position: "absolute",
  top: "12px",
  right: "12px",
  zIndex: "1000000",
  display: "flex",
  alignItems: "center",
  gap: "6px",
  padding: "0",
  background: "transparent"
});

      stage.appendChild(controls);
      controls.appendChild(colorInput);

      Object.assign(colorInput.style, {
        position: "static",
        width: "36px",
        height: "36px",
        padding: "0",
        border: "1px solid #000",
        cursor: "pointer"
      });

      const colorSwatchStyle = document.createElement("style");
colorSwatchStyle.textContent = `
  input[type="color"]::-webkit-color-swatch-wrapper {
    padding: 0;
  }

  input[type="color"]::-webkit-color-swatch {
    border: none;
  }
`;
document.head.appendChild(colorSwatchStyle);

      let selectedShape = "circle";
      const shapeButtons = {};
      const shapeOptions = [
        { name: "circle", symbol: "●", label: "동그라미" },
        { name: "triangle", symbol: "▲", label: "세모" },
        { name: "square", symbol: "■", label: "네모" }
      ];

      function updateShapeButtons() {
        shapeOptions.forEach((option) => {
          const button = shapeButtons[option.name];
          const selected = selectedShape === option.name;

          button.style.background = selected ? "#222" : "#fff";
          button.style.color = selected ? "#fff" : "#222";
          button.style.borderColor = "#000";
        });
      }

      shapeOptions.forEach((option) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = option.symbol;
        button.title = option.label;
        button.setAttribute("aria-label", option.label);

        Object.assign(button.style, {
          width: "36px",
          height: "36px",
          padding: "0",
          border: "1px solid #000",
          borderRadius: "6px",
          fontSize: "21px",
          lineHeight: "1",
          cursor: "pointer"
        });

        button.addEventListener("click", (event) => {
          event.stopPropagation();
          selectedShape = option.name;
          updateShapeButtons();
        });

        shapeButtons[option.name] = button;
        controls.appendChild(button);
      });

      
      controls.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });

      
const introOverlay = document.createElement("div");

Object.assign(introOverlay.style, {
  position: "fixed",
  inset: "0",
  width: "100vw",
  height: "100vh",
  background: "rgba(0, 0, 0, 0.7)",
  zIndex: "2147483647",
  color: "#fff",
  fontFamily: "Pretendard, sans-serif",
  fontSize: "clamp(13px, 1.2vw, 18px)",
  fontWeight: "400",
  cursor: "pointer"
});


const imageRect = picture.getBoundingClientRect();

const instruction1 = document.createElement("div");
instruction1.textContent = "click to switch images";

Object.assign(instruction1.style, {
  position: "absolute",
  left: `${imageRect.left + imageRect.width / 2}px`,
  top: `${imageRect.top + imageRect.height / 2 + 20 - 10}px`,
  transform: "translate(-50%, -50%)",
  whiteSpace: "nowrap"
});

introOverlay.appendChild(instruction1);


const instructionsRight = document.createElement("div");

Object.assign(instructionsRight.style, {
  position: "absolute",
  left: `${Math.min(imageRect.right + 300, window.innerWidth - 340)}px`,
  top: `${imageRect.top + imageRect.height / 2 - 10}px`,
  transform: "translateY(-50%)",
  display: "flex",
  alignItems: "center",
  flexWrap: "wrap",
  gap: "300px",
  maxWidth: "calc(100vw - 40px)",
  padding: "12px"
});


const instruction2 = document.createElement("div");

Object.assign(instruction2.style, {
  display: "flex",
  flexDirection: "column",
  alignItems: "flex-start",
  gap: "6px",
  textAlign: "left",
  whiteSpace: "nowrap"
});

const arrow2 = document.createElement("span");
arrow2.textContent = "-→";
arrow2.style.fontSize = "30px";

const instruction2Text = document.createElement("span");
instruction2Text.textContent = "click and drag to draw";

instruction2.append(arrow2, instruction2Text);


const instruction3 = document.createElement("div");
Object.assign(instruction3.style, {
  display: "flex",
  flexDirection: "column",
  alignItems: "flex-start",
  gap: "6px",
  textAlign: "left",
  whiteSpace: "nowrap"
});

const bigDot = document.createElement("span");
bigDot.textContent = "●";
bigDot.style.fontSize = "30px";

const shapeText = document.createElement("span");
shapeText.textContent = "click to make shapes";

instruction3.append(bigDot, shapeText);
instructionsRight.append(instruction2, instruction3);
introOverlay.appendChild(instructionsRight);

// 화면을 클릭하면 안내 화면 제거
introOverlay.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  event.stopPropagation();
  introOverlay.remove();
});

document.body.appendChild(introOverlay);

      updateShapeButtons();
      colorInput.value = "#ff0000";
stage.style.backgroundColor = colorInput.value;
      stage.style.backgroundColor = colorInput.value;

      const scale = window.devicePixelRatio || 1;
      const sourceCanvas = document.createElement("canvas");
      const sourceContext = sourceCanvas.getContext("2d");



      
      const layers = [];
      let nextLayerZ = 5;

      function makeLayer(type) {
        const canvas = document.createElement("canvas");

        Object.assign(canvas.style, {
          position: "absolute",
          left: "0",
          top: "0",
          width: "100%",
          height: "100%",
          zIndex: String(nextLayerZ++),
          pointerEvents: "none"
        });

        canvas.width = Math.round(stage.clientWidth * scale);
        canvas.height = Math.round(stage.clientHeight * scale);

        const context = canvas.getContext("2d");
        context.setTransform(scale, 0, 0, scale, 0, 0);

        stage.appendChild(canvas);

        const layer = {
          type,
          canvas,
          context,
          mark: null
        };

        layers.push(layer);
        return layer;
      }

      function removeLayer(layer) {
        if (!layer) return;

        const index = layers.indexOf(layer);
        if (index !== -1) {
          layers.splice(index, 1);
        }

        layer.canvas.remove();
      }

      const shapeMarks = [];

      const photoFiles = ["1.jpg", "2.jpg", "3.jpg", "4.jpg", "5.jpg"];
const currentFileName = (picture.getAttribute("src") || "")
  .split("/")
  .pop()
  .split("?")[0];

let photoIndex = photoFiles.findIndex(
  (file) => file.split("/").pop() === currentFileName
);

if (photoIndex < 0) photoIndex = 0;

let clickedBasePicture = false;

      let hasStretchedOnce = false;
      let pointerIsDown = false;
      let isDragging = false;

      let pressStartPoint = null;
      let lastDragPoint = null;
      let stretchCursor = null;
      let selectedStrip = null;
      let activeShapeLayer = null;
      let activeStretchLayer = null;

      let activeShape = "circle";
      let activeAngle = 0;
      let holdStartTime = 0;
      let holdRadius = 12;
      let holdAnimationId = 0;
      let activePointerId = null;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function getPoint(event) {
        const rect = stage.getBoundingClientRect();

        return {
          x: event.clientX - rect.left - stage.clientLeft,
          y: event.clientY - rect.top - stage.clientTop
        };
      }

      function getPictureBounds() {
        const stageRect = stage.getBoundingClientRect();
        const imageRect = picture.getBoundingClientRect();

        return {
          x: imageRect.left - stageRect.left - stage.clientLeft,
          y: imageRect.top - stageRect.top - stage.clientTop,
          width: imageRect.width,
          height: imageRect.height
        };
      }

      function isInsideBasePicture(point) {
  const bounds = getPictureBounds();

  return (
    point.x >= bounds.x &&
    point.x <= bounds.x + bounds.width &&
    point.y >= bounds.y &&
    point.y <= bounds.y + bounds.height
  );
}

function showNextPhoto() {
  photoIndex = (photoIndex + 1) % photoFiles.length;
  picture.src = photoFiles[photoIndex];
}

      function drawShape(layer, mark) {
        if (!layer || !mark) return;

        const context = layer.context;

        context.setTransform(1, 0, 0, 1, 0, 0);
        context.clearRect(
          0,
          0,
          layer.canvas.width,
          layer.canvas.height
        );
        context.setTransform(scale, 0, 0, scale, 0, 0);

        context.save();
        context.translate(mark.x, mark.y);
        context.rotate(mark.angle);
        context.fillStyle = colorInput.value;
        context.beginPath();

        if (mark.shape === "circle") {
          context.arc(0, 0, mark.radius, 0, Math.PI * 2);
        } else if (mark.shape === "triangle") {
          context.moveTo(0, -mark.radius);
          context.lineTo(mark.radius * 0.866, mark.radius * 0.5);
          context.lineTo(-mark.radius * 0.866, mark.radius * 0.5);
          context.closePath();
        } else if (mark.shape === "square") {
          context.rect(
            -mark.radius,
            -mark.radius,
            mark.radius * 2,
            mark.radius * 2
          );
        }

        context.fill();
        context.restore();
      }

      function redrawAllShapes() {
        layers.forEach((layer) => {
          if (layer.type === "shape" && layer.mark) {
            drawShape(layer, layer.mark);
          }
        });
      }

      function getActiveMark() {
        if (!pressStartPoint || !activeShapeLayer) return null;

        return {
          shape: activeShape,
          x: pressStartPoint.x,
          y: pressStartPoint.y,
          radius: holdRadius,
          angle: activeAngle
        };
      }

      
      colorInput.addEventListener("input", () => {
        stage.style.backgroundColor = colorInput.value;
        redrawAllShapes();

        if (activeShapeLayer) {
          activeShapeLayer.mark = getActiveMark();
          drawShape(activeShapeLayer, activeShapeLayer.mark);
        }
      });

      function capturePhotoSource() {
        const width = stage.clientWidth;
        const height = stage.clientHeight;
        const bounds = getPictureBounds();

        sourceCanvas.width = Math.round(width * scale);
        sourceCanvas.height = Math.round(height * scale);
        sourceContext.setTransform(scale, 0, 0, scale, 0, 0);
        sourceContext.clearRect(0, 0, width, height);

        sourceContext.drawImage(
          picture,
          bounds.x,
          bounds.y,
          bounds.width,
          bounds.height
        );

       
        layers.forEach((layer) => {
          if (layer.type === "stretch") {
            sourceContext.drawImage(
              layer.canvas,
              0,
              0,
              width,
              height
            );
          }
        });

        return bounds;
      }

      function hasPhotoAt(x, y) {
        try {
          const pixelX = Math.floor(x * scale);
          const pixelY = Math.floor(y * scale);

          if (
            pixelX < 0 ||
            pixelY < 0 ||
            pixelX >= sourceCanvas.width ||
            pixelY >= sourceCanvas.height
          ) {
            return false;
          }

          return sourceContext.getImageData(
            pixelX,
            pixelY,
            1,
            1
          ).data[3] > 0;
        } catch (error) {
          return true;
        }
      }

      function prepareStretch(startPoint) {
        const bounds = capturePhotoSource();
        const width = stage.clientWidth;
        const height = stage.clientHeight;

        const stripWidth = Math.max(
          2,
          Math.min(8, bounds.width * 0.012)
        );

        const stripHeight = Math.min(bounds.height, height);
        const stripY = clamp(
          bounds.y,
          0,
          Math.max(0, height - stripHeight)
        );

        const firstStretch = !hasStretchedOnce;
        let stripX = firstStretch
          ? bounds.x + bounds.width - stripWidth
          : startPoint.x - stripWidth / 2;

        stripX = clamp(
          stripX,
          0,
          Math.max(0, width - stripWidth)
        );

        if (
          !firstStretch &&
          !hasPhotoAt(stripX + stripWidth / 2, stripY + stripHeight / 2)
        ) {
          stripX = clamp(
            bounds.x + bounds.width - stripWidth,
            0,
            Math.max(0, width - stripWidth)
          );
        }

        selectedStrip = {
          x: stripX,
          y: stripY,
          width: stripWidth,
          height: stripHeight
        };

        stretchCursor = firstStretch
          ? {
              x: bounds.x + bounds.width,
              y: bounds.y + bounds.height / 2
            }
          : {
              x: startPoint.x,
              y: startPoint.y
            };

        lastDragPoint = {
          x: startPoint.x,
          y: startPoint.y
        };

        hasStretchedOnce = true;

        
        activeStretchLayer = makeLayer("stretch");
      }

      function drawStretchTo(point) {
        if (
          !activeStretchLayer ||
          !selectedStrip ||
          !stretchCursor ||
          !lastDragPoint
        ) {
          return;
        }

        const dx = point.x - lastDragPoint.x;
        const dy = point.y - lastDragPoint.y;
        const distance = Math.hypot(dx, dy);

        if (distance < 1) return;

        const segmentCount = Math.max(1, Math.ceil(distance / 3));
        const stepX = dx / segmentCount;
        const stepY = dy / segmentCount;
        const stepDistance = distance / segmentCount;
        const angle = Math.atan2(dy, dx);
        const context = activeStretchLayer.context;

        for (let i = 0; i < segmentCount; i++) {
          context.save();
          context.translate(stretchCursor.x, stretchCursor.y);
          context.rotate(angle);
          context.globalAlpha = 0.97;

          context.drawImage(
            sourceCanvas,
            selectedStrip.x * scale,
            selectedStrip.y * scale,
            selectedStrip.width * scale,
            selectedStrip.height * scale,
            0,
            -selectedStrip.height / 2,
            Math.max(8, stepDistance * 2.4),
            selectedStrip.height
          );

          context.restore();

          stretchCursor.x += stepX;
          stretchCursor.y += stepY;
        }

        lastDragPoint = {
          x: point.x,
          y: point.y
        };
      }

      function animateHoldShape(time) {
        if (!pointerIsDown || isDragging || !activeShapeLayer) {
          return;
        }

        const maxRadius = Math.min(
          400,
          Math.max(
            20,
            Math.min(stage.clientWidth, stage.clientHeight) * 0.35
          )
        );

        holdRadius = Math.min(
          maxRadius,
          12 + (time - holdStartTime) * 0.15
        );

        activeShapeLayer.mark = getActiveMark();
        drawShape(activeShapeLayer, activeShapeLayer.mark);
        holdAnimationId = requestAnimationFrame(animateHoldShape);
      }

      stage.addEventListener("pointerdown", (event) => {
  if (event.button !== 0 || controls.contains(event.target)) {
    return;
  }

  event.preventDefault();

  pointerIsDown = true;
  isDragging = false;
  activePointerId = event.pointerId;
  pressStartPoint = getPoint(event);

  
  clickedBasePicture = isInsideBasePicture(pressStartPoint);

  holdStartTime = performance.now();
  holdRadius = 12;

  activeShape = selectedShape;
  activeAngle =
    activeShape === "circle"
      ? 0
      : Math.random() * Math.PI * 2;


  activeShapeLayer = null;

  if (!clickedBasePicture) {
    activeShapeLayer = makeLayer("shape");
    activeShapeLayer.mark = getActiveMark();
    drawShape(activeShapeLayer, activeShapeLayer.mark);

    holdAnimationId = requestAnimationFrame(animateHoldShape);
  }

  try {
    stage.setPointerCapture(event.pointerId);
  } catch (error) {}
});

      stage.addEventListener("pointermove", (event) => {
        if (
          !pointerIsDown ||
          event.pointerId !== activePointerId
        ) {
          return;
        }

        const point = getPoint(event);

        if (!isDragging) {
          const moved = Math.hypot(
            point.x - pressStartPoint.x,
            point.y - pressStartPoint.y
          );

          if (moved < 6) return;

          isDragging = true;
          cancelAnimationFrame(holdAnimationId);

          
          removeLayer(activeShapeLayer);
          activeShapeLayer = null;

          prepareStretch(pressStartPoint);
        }

        drawStretchTo(point);
      });

      function endPointer(event, keepShape) {
  if (
    !pointerIsDown ||
    event.pointerId !== activePointerId
  ) {
    return;
  }

  cancelAnimationFrame(holdAnimationId);

 
  if (!isDragging && keepShape && clickedBasePicture) {
    showNextPhoto();
  } else if (!isDragging && activeShapeLayer && keepShape) {
    activeShapeLayer.mark = getActiveMark();
    drawShape(activeShapeLayer, activeShapeLayer.mark);
    shapeMarks.push(activeShapeLayer.mark);
  } else if (activeShapeLayer) {
    removeLayer(activeShapeLayer);
  }

  pointerIsDown = false;
  activeShapeLayer = null;
  activeStretchLayer = null;

  try {
    if (stage.hasPointerCapture(event.pointerId)) {
      stage.releasePointerCapture(event.pointerId);
    }
  } catch (error) {}

  pressStartPoint = null;
  lastDragPoint = null;
  stretchCursor = null;
  selectedStrip = null;
  activePointerId = null;
  holdRadius = 12;
  clickedBasePicture = false;
}

      stage.addEventListener("pointerup", (event) => {
        endPointer(event, true);
      });

      stage.addEventListener("pointercancel", (event) => {
        endPointer(event, false);
      });
    }

    if (picture.complete && picture.naturalWidth > 0) {
      start();
    } else {
      picture.addEventListener("load", start, { once: true });
      picture.addEventListener(
        "error",
        () => console.error("1.jpg 이미지를 불러오지 못했어요."),
        { once: true }
      );
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init, { once: true });
  } else {
    init();
  }
})();
</script>
</body>
</html>
